# Generado con el arquetipo foro-ms-arquetipo
spring.application.name=@project.artifactId@
server.port=@puerto@

# ------------------------------------------------------------------
# Credenciales de Oracle: se leen desde config/oracle.properties
# (fuera del repositorio), compartido por todos los microservicios.
# ------------------------------------------------------------------
spring.config.import=optional:file:../config/oracle.properties

# ------------------------------------------------------------------
# Conexión a Oracle Autonomous Database con Wallet
# ------------------------------------------------------------------
spring.datasource.url=jdbc:oracle:thin:@${oracle.tns-name}?TNS_ADMIN=${oracle.wallet-path}
spring.datasource.username=${oracle.app-user}
spring.datasource.password=${oracle.app-password}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeño: la base Developer admite máximo 30 sesiones simultáneas
spring.datasource.hikari.maximum-pool-size=3

# JPA: las tablas las crea el script SQL, Hibernate no las modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Errores con mensaje y validaciones en el JSON
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
